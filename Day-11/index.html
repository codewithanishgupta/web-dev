<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Media Player</title>
    </head>
    <body>
        <header>
            <h1>HTML Media Players</h1>
        </header>
        <main>
            <h2>All Video</h2>
            <span><video controls width="400" src="1.mp4.mp4"></video></span>
            <span><video controls width="400" src="2.mp4.mp4"></video></span>
            <span><video controls width="400" src="3.mp4.mp4"></video></span>
            <span><video controls width="400" src="4.mp4.mp4"></video></span>
            <span><video controls width="400" src="5.mp4.mp4"></video></span>
            
            <h2>All Audio </h2>
            <span><audio controls src="1.mp3"></audio></span>
            <span><audio controls src="2.mp3"></audio></span>
            <span><audio controls src="3.mp3"></audio></span>
            <span><audio controls src="4.mp3"></audio></span>
            <span><audio controls src="5.mp3"></audio></span>
        </main> 

        <footer>End of Media File</footer>
    </body>
</html>
