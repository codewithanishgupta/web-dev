            .boxes::after{
                content: "34 day of web-dev";
                color: red;
            }
            .boxes::before{
                content: "Anish Gupta";
                color: orangered;
            }

            ::selection{
                background-color: black;
                color: aquamarine;
            }

            .box::first-letter{
                color: rgb(189, 189, 15);
                font-size: 56px;
            }

            input::placeholder{
                color: blueviolet;
            }
        </style>
    </head>
    <body>
        <div class="boxes">
            <div data-color="primary"="" class="box">I am first box</div>
            <div class="box">I am second box</div>
            <div class="box">I am Third box</div>
            <input type="text" placeholder="Type your name">
        </div>
    </body>
