<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UltraEdit</title>
        <style>
            *{
                padding: 0;
                margin: 0;
            }
            header nav{
                margin: 20px 5vw;
                background-color: alicebox blue;
                width: 90vw;
                height: 10vh;
                border: 2px solid rgbox b(242, 242, 150);
                display: flex;
                align-items: center;
                justify-content: space-around;
            }
            .logo img{
                width: 120px;
            }
            .right ul {
                display: flex;
                gap: 40px;
            }
            .right ul li {
                list-style: none;
                display: flex;
                align-items: center;
                cursor: pointer;
            }

            .right ul li img{
                width: 20px;
            }

            main{
                border: 2px solid blueviolet;
                width: 90vw;
                margin: 20px 5vw;
                padding: 10px;
                display: grid;
                grid-template-columns: repeat(3,80px);
                row-gap: 20px;
                column-gap: 20px;
                justify-content: space-around;
                
            }
            main .box {
                width: 250px;
                height: 100px;
                background-color: rgb(231, 230, 229);
                gap: 5px;
                text-align: center;
                padding: 10px;
            }
            .box .link1{
                background-color: blue;
                width: 30px;
            }
        </style>
    </head>
    <box body>
        <header>
            <nav>
                <div class="logo">
                    <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/Dark-logo.png" alt="">
                </div>

                <div class="right">
                    <ul>
                        <li><span>Product</span><img src="down-arrow.png" alt=""></li>
                        <li><span>Pricing</span><img src="down-arrow.png" alt=""></li>
                        <li><span>Resource</span><img src="down-arrow.png" alt=""></li>
                        <li><span>Abox bout Us</span><img src="down-arrow.png" alt=""></li>
                        <li>
                            <img src="https://www.ultraedit.com/wp-content/themes/Divi_Child/img/Lang.png" alt="">
                        </li>
                    </ul>
                </div>
            </nav>
        </header>
        <main>
            <div class="box ">English
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Deutch
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Italiano
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Esp`nal
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Francais
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Portugues brasileiro
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Japanese
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Korian
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Chinese
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
            <div class="box ">Traditional Chinese
                <div class="lin1"></div>
                <div class="link2"></div>
            </div>
        </main>
    </box body>
</html>
