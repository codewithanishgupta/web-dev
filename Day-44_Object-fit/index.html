<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Object-fit in CSS</title>
        <style>
            .container{
                height: 488px;
            width: 466px;
            border: 2px solid black;
            /* background-color: azure; */
            background-position: center center;
            background-clip: border-box;

            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkxulkWgJjz5dhoKI4d7OliorOXlC6kzSY1gm_KhkSoJtHrvzbSm1WLY3e&s=10");
            background-repeat: no-repeat;
            background-repeat:repeat-x;
            background-repeat:repeat-y;
            }

            img{
                width: 466px;
            height: 488px;
            object-fit: contain;
            /* object-fit: fill; */
            object-position: 10px 20px;
            /* object-position: bottom right; */
            /* object-fit: contain; */
            }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkxulkWgJjz5dhoKI4d7OliorOXlC6kzSY1gm_KhkSoJtHrvzbSm1WLY3e&s=10" alt=""> -->
        </div>
    </body>
</html>
